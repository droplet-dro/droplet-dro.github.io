<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aviation Weather Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
    }

    header {
        background: #161b22;
        padding: 15px 20px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid #30363d;
    }

    .container {
        display: flex;
        gap: 15px;
        padding: 15px;
        height: calc(100vh - 80px);
        box-sizing: border-box;
    }

    .panel {
        flex: 1;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 300px;
    }

    .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 300px;
        height: 100%; /* ensures proportional heights work */
        gap: 10px; /* ← adds spacing between subpanels */
    }

    /* 70% height panel */
    .subpanel-70 {
        flex: 0 0 calc(70% - 7px); /* subtract proportional gap share */
        display: flex;
        flex-direction: column;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
    }

    /* 20% height panel */
    .subpanel-20 {
        flex: 0 0 calc(20% - 2px);
        display: flex;
        flex-direction: column;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
    }

    /* 10% height panel */
    .subpanel-10 {
        flex: 0 0 calc(10% - 1px);
        display: flex;
        flex-direction: column;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
    }

    .panel-header {
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
        background: #1d232a;
        border-bottom: 1px solid #30363d;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        flex: 1;
    }

    .content {
        padding: 10px;
        overflow-y: auto;
        flex: 1;
    }

    .reference-content {
        white-space: normal; /* fixes indentation */
    }


    /* Mobile layout */
    @media (max-width: 900px) {
        .container {
            flex-direction: column;
            height: auto;
        }
        .panel, .right-column {
            min-height: 400px;
        }
        .right-column {
            gap: 15px;
        }
    }
</style>
</head>

<body>

<header>EGLL / EGLM Weather Dashboard</header>

<div class="container">

    <!-- EGLL METAR -->
    <div class="panel">
        <div class="panel-header">EGLL METAR (CheckWX)</div>
        <iframe src="https://www.checkwx.com/weather/EGLL/metar"></iframe>
    </div>

    <!-- EGLL TAF -->
    <div class="panel">
        <div class="panel-header">EGLL TAF (CheckWX)</div>
        <iframe src="https://www.checkwx.com/weather/EGLL/taf"></iframe>
    </div>

    <!-- RIGHT COLUMN (STACKED) -->
    <div class="right-column">

        <!-- EGLM Area METAR (CheckWX iframe) -->
        <div class="subpanel-70">
            <div class="panel-header">EGLM Area METAR (CheckWX)</div>
            <iframe src="https://www.checkwx.com/weather/EGLM/area/metar"></iframe>
        </div>
        
        <!-- EGLM Weather -->
        <div class="subpanel-20">
            <div class="panel-header">EGLM Weather (Open‑Meteo)</div>
            <div id="eglm" class="content">Loading EGLM weather…</div>
        </div>

        <!-- Reference Section -->
        <div class="subpanel-10">
            <div class="panel-header">Reference</div>
            <div class="content reference-content">
                For cross-checking EGLM weather, visit:
                <ul>
                <li>
                    <a href="https://www.flightaware.com/resources/airport/EGLM/weather"
                        target="_blank"
                        style="color:#58a6ff; text-decoration:none;">
                        EGLM Weather - flightaware.com
                    </a>
                </li>
                </ul>            
            </div>
        </div>

    </div>
</div>



<script>
// -------------------------
// Fetch EGLM Weather (Open‑Meteo Aviation API)
// -------------------------
async function loadEGLM() {
    // EGLM coordinates (White Waltham Airfield)
    const lat = 51.500;
    const lon = -0.774;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,visibility,cloud_base,wind_speed_10m,wind_direction_10m`;

    const res = await fetch(url);
    const data = await res.json();

    const idx = 0; // current hour

    const text = `
Location: EGLM (White Waltham)

Temperature: ${data.hourly.temperature_2m[idx]}°C
Visibility: ${data.hourly.visibility[idx]} m
Cloud Base: ${data.hourly.cloud_base[idx]} m
Wind: ${data.hourly.wind_direction_10m[idx]}° @ ${data.hourly.wind_speed_10m[idx]} m/s
    `;

    document.getElementById("eglm").innerText = text.trim();
}

// Auto-refresh every 5 minutes
function refreshAll() {
    loadEGLM();
}

refreshAll();
setInterval(refreshAll, 5 * 60 * 1000);
</script>

</body>
</html>
